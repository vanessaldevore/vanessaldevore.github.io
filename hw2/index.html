<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="text-center">

    <h1 class="p-4 bg-light">Hangman</h1>

    <h3 id="hint" class="mb-3">Hint: </h3>

    <h2 id="wordDisplay" class="mb-2"></h2>

    <div class="mb-3">
        <span class="me-3">Wrong Left: <b id="lives">6</b></span>
        <span>Attempts: <b id="attempts">0</b></span>
    </div>

    <div class="mb-2">
        <input type="text" id="guessInput" maxlength="1" placeholder="Enter 1 letter">
        <button type="button" class="btn btn-outline-light btn-lg" id="guessBtn">Guess</button>
        <button type="button" class="btn btn-outline-light btn-lg" id="newBtn">New Game</button>
    </div>

    <h4 id="validationFdbk" class="bg-danger text-white"></h4>

    <div id="message"></div>

    <h4 class="mt-3">Wrong Letters:</h4>
    <div id="wrongLetters" class="mb-3"></div>

    <script src="js/script.js"></script>
</body>
</html>
