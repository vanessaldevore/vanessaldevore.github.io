<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Marine Science Quiz </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/underscore@1.13.2/underscore-umd-min.js"> </script> 
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-center">

    <h1 class="p-4 bg-light"> <img src="img/dolphin.png" alt="Dolphin"> Marine Science Quiz <img src="img/starfish.png" alt="Starfish"> </h1>

    <h3> What is the largest animal in the ocean? </h3>
    <input type="text" id="q1">
    <div id="q1Feedback"></div>
    <hr>
    <br>

    <h3><span id="markImg2"></span>What do coral reefs consist of?</h3>
    <select id="q2">
        <option value="">Select One</option>
        <option>Colorful rocks</option>
        <option>Sea plants</option>
        <option>Tiny living animals called polyps</option>
        <option>Shells glued together</option>
    </select>
    <div id="q2Feedback"></div>
    <hr>
    <br>

    <h3><span id="markImg3"></span>Which options are a real name of a part of the ocean?</h3>
    <input type="checkbox" id="NevereverLand"> <label for="Neverever Land">Neverever Land</label> <br>
    <input type="checkbox" id="BermudaTriangle"> <label for="Bermuda Triangle">Bermuda Triangle</label> <br>
    <input type="checkbox" id="GreatBarrierReef"> <label for="Great Barrier Reef">Great Barrier Reef</label> <br>
    <input type="checkbox" id="PacificRidge"> <label for="Pacific Ridge">Pacific Ridge</label>
    <div id="q3Feedback"></div>
    <hr>
     <br>

    <h3><span id="markImg4"></span>Why are phytoplankton important to the ocean and us?</h3>
    <div id="q4Choices"></div>
    <div id="q4Feedback"></div>
    <hr>
     <br>

    <h3><span id="markImg5"></span>How many hearts does an octopus have?</h3>
    <select id="q5">
        <option value="">Select One</option>
        <option>8</option>
        <option>1</option>
        <option>3</option>
    </select>
    <div id="q5Feedback"></div>
    <hr>
     <br>

    <h3 id="validationFdbk" class="bg-danger text-white"></h3>
    <button type="button" class="btn btn-outline-light btn-lg"> Submit Quiz </button>
    <br>

    <span id="congratsMessage"></span>
    <br>
    <h2 id="totalScore" class="text-info"></h2>

    <h3 id="totalAttempts"></h3>

    <script src="js/script.js"></script>
</body>
</html>
